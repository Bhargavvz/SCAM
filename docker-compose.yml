services:
  meridian:
    build: .
    restart: unless-stopped
    env_file: .env
    ports: ["8100:8100"]
    volumes:
      - meridian-data:/app/data                                   # operational database: keeps app records across restarts
      - ../sc_memory_extension/data:/source:ro                    # the source dataset (never written)
volumes:
  meridian-data:
